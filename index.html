<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="navbar">
        <div class="nav-left">
            <div class="logo">
                <img src="image-removebg-preview.png" alt="Logo" />
            </div>
            <div class="site-name">
                <h1>Task Tracker</h1>
            </div>
        </div>
        <button class="menu-toggle" aria-label="Toggle menu">☰</button>
        <nav class="nav-links">
            <ul>
                <li><a href="#home" data-section="home" class="active">Home</a></li>
                <li><a href="#about" data-section="about">About Us</a></li>
                <li><a href="#services" data-section="services">Services</a></li>
                <li><a href="#contact" data-section="contact">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main class="content">
        <section id="home" class="section show">
            <h2>Home</h2>
            <p>Welcome to Task Tracker.</p>
        </section>
        <section id="about" class="section">
            <h2>About Us</h2>
            <p>We help you manage tasks simply.</p>
        </section>
        <section id="services" class="section">
            <h2>Services</h2>
            <p>Our services include task tracking and reporting.</p>
        </section>
        <section id="contact" class="section">
            <h2>Contact</h2>
            <p>Get in touch via email or phone.</p>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
